[project]
name = "constituency-wiki-flow"
version = "0.1.0"
description = "CrewAI Flow to extract Indian assembly constituency data from Wikipedia"
requires-python = ">=3.11"
dependencies = [
    "crewai[litellm]>=1.14.0",
    "mwparserfromhell>=0.6.6",
    "requests>=2.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "rich>=13.0.0",
    "typer>=0.12.0",
]

[project.scripts]
flow = "src.flow:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
