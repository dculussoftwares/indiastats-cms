name: "Deploy to Azure"

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'infra/**'
      - 'Dockerfile'
      - 'tests/**'
      - 'next.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tailwind.config.mjs'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.github/workflows/terraform-deploy.yml'
      - 'public/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RESOURCE_GROUP: rg-indiastats-prod
  # Terraform Backend Config (Sponsorship Subscription)
  TF_BACKEND_STORAGE_ACCOUNT: stindiastfstate23438
  TF_BACKEND_CONTAINER: tfstate
  TF_BACKEND_KEY: indiastats.tfstate
  TF_BACKEND_RG: rg-indiastats-tfstate

permissions:
  id-token: write
  contents: read
  packages: write

jobs:
  # Detects which parts of the repo changed so downstream jobs can be skipped.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'Dockerfile'
              - 'next.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tailwind.config.mjs'
              - 'postcss.config.js'
              - 'public/**'
              - 'infra/**'
              - '.github/workflows/terraform-deploy.yml'

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      sha_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URI=${{ secrets.DATABASE_URL }}
            DATABASE_URI_DIRECT=${{ secrets.DATABASE_URL_DIRECT }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            NEXT_PUBLIC_SERVER_URL=https://indiastats.org
            NEXT_PUBLIC_CLARITY_ID=${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_MIXPANEL_TOKEN=${{ secrets.NEXT_PUBLIC_MIXPANEL_TOKEN }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE=${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}

      - name: Get SHA Tag
        id: sha
        run: echo "tag=${{ github.sha }}" | cut -c1-7 >> $GITHUB_OUTPUT

  migrate-schema:
    name: Migrate DB Schema
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Push schema to DB (direct connection, bypasses PgBouncer)
        run: pnpm exec tsx scripts/push-db-schema.ts
        timeout-minutes: 10
        # continue-on-error: schema push handles new columns; if it detects
        # tables outside Payload's schema it will prompt and block — allow
        # the job to proceed since the Docker build step already runs the push.
        continue-on-error: true
        env:
          # Uses direct PostgreSQL URL — not PgBouncer — so advisory locks work
          DATABASE_URI: ${{ secrets.DATABASE_URL_DIRECT }}
          PAYLOAD_SCHEMA_PUSH: "true"
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SERVER_URL: https://indiastats.org
          # Placeholder Azure Storage creds so the storage plugin initialises without hanging.
          # Real creds are only needed at runtime, not during schema push.
          AZURE_STORAGE_CONNECTION_STRING: "DefaultEndpointsProtocol=https;AccountName=placeholder;AccountKey=cGxhY2Vob2xkZXI=;EndpointSuffix=core.windows.net"
          AZURE_STORAGE_ACCOUNT_BASEURL: "https://placeholder.blob.core.windows.net/"

  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-schema]
    if: |
      always() &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (needs.migrate-schema.result == 'success' || needs.migrate-schema.result == 'skipped') &&
      (needs.build-and-push.result == 'success' || needs.migrate-schema.result == 'success')
    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="storage_account_name=${{ env.TF_BACKEND_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=${{ env.TF_BACKEND_CONTAINER }}" \
            -backend-config="key=${{ env.TF_BACKEND_KEY }}" \
            -backend-config="resource_group_name=${{ env.TF_BACKEND_RG }}" \
            -backend-config="use_oidc=true"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      - name: Terraform Plan
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          terraform plan -out=tfplan -input=false \
            -var="container_image=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${SHORT_SHA}" \
            -var="storage_account_name=stindiastatsmediaspn"
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true
          TF_VAR_database_url: ${{ secrets.DATABASE_URL }}
          TF_VAR_payload_secret: ${{ secrets.PAYLOAD_SECRET }}
          TF_VAR_ga_id: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          TF_VAR_cron_secret: ${{ secrets.CRON_SECRET }}

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: true

      - name: Get Container App URL
        run: |
          echo "🚀 Deployment Complete!"

  smoke-test:
    name: Smoke Test
    if: false
    runs-on: ubuntu-latest
    needs: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT
        id: pnpm-cache

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        run: pnpm exec playwright install chromium --with-deps

      - name: Run Smoke Tests
        run: pnpm run test:smoke
        env:
          BASE_URL: https://indiastats.org
