# Builds the image and pushes it to GHCR. Deployment is NOT done here: infrastructure lives in the
# private dculus-infra repo, where the image tag is chosen in deploy/indiastats.yaml.
name: "Build & Push Image"

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'Dockerfile'
      - 'tests/**'
      - 'next.config.js'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'tailwind.config.mjs'
      - 'postcss.config.js'
      - 'tsconfig.json'
      - '.github/workflows/terraform-deploy.yml'
      - 'public/**'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  # Detects which parts of the repo changed so downstream jobs can be skipped.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            app:
              - 'src/**'
              - 'Dockerfile'
              - 'next.config.js'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'tailwind.config.mjs'
              - 'postcss.config.js'
              - 'public/**'
              - '.github/workflows/terraform-deploy.yml'

  build-and-push:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}
      image_digest: ${{ steps.build.outputs.digest }}
      sha_tag: ${{ steps.sha.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            DATABASE_URI=${{ secrets.DATABASE_URL }}
            DATABASE_URI_DIRECT=${{ secrets.DATABASE_URL_DIRECT }}
            PAYLOAD_SECRET=${{ secrets.PAYLOAD_SECRET }}
            NEXT_PUBLIC_SERVER_URL=https://indiastats.org
            NEXT_PUBLIC_CLARITY_ID=${{ secrets.NEXT_PUBLIC_CLARITY_ID }}
            NEXT_PUBLIC_POSTHOG_KEY=${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
            NEXT_PUBLIC_POSTHOG_HOST=${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
            NEXT_PUBLIC_MIXPANEL_TOKEN=${{ secrets.NEXT_PUBLIC_MIXPANEL_TOKEN }}
            NEXT_PUBLIC_GA_ID=${{ secrets.NEXT_PUBLIC_GA_ID }}
            NEXT_PUBLIC_OPENPANEL_CLIENT_ID=${{ secrets.NEXT_PUBLIC_OPENPANEL_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_CLIENT_ID=${{ secrets.NEXT_PUBLIC_ADSENSE_CLIENT_ID }}
            NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE=${{ secrets.NEXT_PUBLIC_ADSENSE_SLOT_IN_ARTICLE }}

      - name: Get SHA Tag
        id: sha
        run: echo "tag=${{ github.sha }}" | cut -c1-7 >> $GITHUB_OUTPUT

      - name: Prune Old Images (Keep Last 5)
        uses: actions/delete-package-versions@v5
        continue-on-error: true
        with:
          package-name: 'indiastats-cms'
          package-type: 'container'
          min-versions-to-keep: 5
          ignore-versions: '^(latest)$'
          token: ${{ secrets.GITHUB_TOKEN }}

  migrate-schema:
    name: Migrate DB Schema (new shared Postgres)
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'workflow_dispatch' || needs.changes.outputs.app == 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pending Payload migrations (direct connection, bypasses PgBouncer)
        run: pnpm exec payload migrate
        timeout-minutes: 5
        env:
          # Uses direct PostgreSQL URL — not PgBouncer — so advisory locks work
          DATABASE_URI: ${{ secrets.DATABASE_URL_DIRECT }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_SERVER_URL: https://indiastats.org

  # Production deploy through the private infra repo. Waits for approval (production-approval environment);
  # approving starts the deploy of exactly the image built above.
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push, migrate-schema]
    if: github.ref == 'refs/heads/main' && needs.build-and-push.result == 'success' && needs.migrate-schema.result == 'success'
    environment: production-approval
    permissions:
      contents: read
    steps:
      - name: Start the infra deploy
        env:
          GH_TOKEN: ${{ secrets.INFRA_DEPLOY_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            gh workflow run deploy.yml -R dculussoftwares/dculus-infra -f app=indiastats -f env=prod -f version="${SHA:0:7}" && exit 0
            sleep 15
          done
          echo "could not start the infra deploy"; exit 1
