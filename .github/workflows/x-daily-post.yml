name: X Daily Post

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: '30 1 * * *'
    # 10:00 AM IST = 04:30 UTC
    - cron: '30 4 * * *'
    # 1:00 PM IST = 07:30 UTC
    - cron: '30 7 * * *'
    # 4:00 PM IST = 10:30 UTC
    - cron: '30 10 * * *'
    # 7:00 PM IST = 13:30 UTC
    - cron: '30 13 * * *'
    # 10:00 PM IST = 16:30 UTC
    - cron: '30 16 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (skip actual posting)'
        required: false
        default: 'false'
        type: boolean
      assembly_override:
        description: 'Override assembly ID (e.g., ac001)'
        required: false
        type: string

env:
  SITE_URL: https://indiastats.org

# Prevent concurrent runs from racing on the same refresh token
concurrency:
  group: x-daily-post
  cancel-in-progress: false

jobs:
  post-to-x:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Tamil fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core fonts-noto-extra fonts-lohit-taml fonts-samyak-taml fonts-inter
          fc-cache -f -v

      - name: Install dependencies
        run: npm install puppeteer@24

      - name: Load refresh token
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          if [ -f .github/x-token.enc ]; then
            echo "Decrypting token from .github/x-token.enc..."
            TOKEN=$(openssl enc -d -aes-256-cbc -pbkdf2 -pass pass:"$PASS" -base64 -in .github/x-token.enc 2>/dev/null | tr -d '\n')
            # Validate the decrypted token looks like a real OAuth2 token (min 20 chars, no null bytes)
            if [ ${#TOKEN} -ge 20 ]; then
              echo "::add-mask::$TOKEN"
              printf 'REFRESH_TOKEN=%s\n' "$TOKEN" >> $GITHUB_ENV
              echo "Using token from encrypted file (length: ${#TOKEN})."
            else
              echo "Decryption failed or produced invalid token (length: ${#TOKEN}), falling back to Secret."
              printf 'REFRESH_TOKEN=%s\n' "$FALLBACK" >> $GITHUB_ENV
            fi
          else
            echo "No encrypted file found. Using Secret."
            printf 'REFRESH_TOKEN=%s\n' "$FALLBACK" >> $GITHUB_ENV
          fi
        env:
          FALLBACK: ${{ secrets.X_OAUTH2_REFRESH_TOKEN }}
          PASS: ${{ secrets.TWITTER_CLIENT_SECRET }}

      - name: Read state and get next assembly
        id: get-assembly
        run: |
          STATE_FILE=".github/x-post-state.json"
          
          if [ -n "${{ github.event.inputs.assembly_override }}" ]; then
            ASSEMBLY_ID="${{ github.event.inputs.assembly_override }}"
            echo "Using override assembly: $ASSEMBLY_ID"
            echo "assembly_id=$ASSEMBLY_ID" >> $GITHUB_OUTPUT
            echo "next_index=-1" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          LAST_INDEX=$(jq -r '.lastPostedIndex' $STATE_FILE)
          TOTAL=$(jq -r '.totalAssemblies' $STATE_FILE)
          
          NEXT_INDEX=$(( (LAST_INDEX + 1) % TOTAL ))
          ASSEMBLY_NUM=$((NEXT_INDEX + 1))
          ASSEMBLY_ID=$(printf "ac%03d" $ASSEMBLY_NUM)
          
          # Force Timeline (card21) at 7am IST slot (01:xx UTC) every day
          UTC_HOUR=$(date -u +%H)
          if [ "$UTC_HOUR" = "01" ]; then
            echo "force_timeline=true" >> $GITHUB_OUTPUT
            echo "Forcing Timeline template for 7am IST slot"
          else
            echo "force_timeline=false" >> $GITHUB_OUTPUT
          fi

          echo "next_index=$NEXT_INDEX" >> $GITHUB_OUTPUT
          echo "assembly_id=$ASSEMBLY_ID" >> $GITHUB_OUTPUT
          echo "Posting assembly: $ASSEMBLY_ID (index: $NEXT_INDEX)"

      - name: Create capture script
        run: |
          cat > capture.cjs << 'ENDOFSCRIPT'
          const puppeteer = require('puppeteer');
          const fs = require('fs');

          const ASSEMBLY_ID = process.env.ASSEMBLY_ID;
          const SITE_URL = process.env.SITE_URL;

          // 8 templates to post sequentially
          // Timeline, Did You Know, Fight Night, Election Map, Analytics, Breaking News, Newspaper, Bold Classic
          const TEMPLATES = ['card21', 'card18', 'card17', 'card16', 'card13', 'card9', 'card4', 'card1'];
          const CURRENT_TEMPLATE_INDEX = parseInt(process.env.TEMPLATE_INDEX) || 0;
          // Force Timeline (card21) at the 7am IST daily slot so it posts at least once per day
          const FORCE_TIMELINE = process.env.FORCE_TIMELINE === 'true';
          const CARD_TEMPLATE = FORCE_TIMELINE ? 'card21' : TEMPLATES[CURRENT_TEMPLATE_INDEX % TEMPLATES.length];
          if (FORCE_TIMELINE) console.log('Timeline template forced for 7am IST slot');
          
          // Assembly to District mapping
          const DISTRICT_MAP = {
            dt1: ['ac001','ac002','ac003','ac004','ac005','ac006','ac007'],
            dt2: ['ac008','ac009','ac010','ac011','ac012','ac013'],
            dt3: ['ac014','ac015','ac016','ac017','ac018','ac019'],
            dt4: ['ac020','ac021','ac022','ac023','ac024','ac025','ac026'],
            dt5: ['ac027','ac028','ac029','ac030','ac031','ac032','ac033'],
            dt6: ['ac034','ac035','ac036','ac037','ac038','ac039','ac040'],
            dt7: ['ac041','ac042','ac043','ac044','ac045','ac046','ac047','ac048','ac049','ac050','ac051','ac052','ac053','ac054','ac055','ac056','ac057','ac058','ac059','ac060','ac061','ac062','ac063','ac064','ac065','ac066','ac067','ac068','ac069','ac070','ac071','ac072','ac073','ac074','ac075','ac076','ac077','ac078','ac079','ac080','ac081','ac082','ac083','ac084','ac085','ac086','ac087','ac088','ac089','ac090','ac091','ac092','ac093','ac094','ac095','ac096','ac097','ac098'],
            dt8: ['ac099','ac100','ac101','ac102','ac103','ac104','ac105'],
            dt9: ['ac106','ac107','ac108','ac109','ac110','ac111','ac112'],
            dt10: ['ac113','ac114','ac115','ac116','ac117','ac118','ac119'],
            dt11: ['ac120','ac121','ac122','ac123','ac124','ac125'],
            dt12: ['ac126','ac127','ac128','ac129','ac130','ac131','ac132'],
            dt13: ['ac133','ac134','ac135','ac136','ac137','ac138'],
            dt14: ['ac139','ac140','ac141','ac142','ac143','ac144'],
            dt15: ['ac145','ac146','ac147','ac148','ac149','ac150'],
            dt16: ['ac151','ac152','ac153','ac154','ac155','ac156'],
            dt17: ['ac157','ac158','ac159','ac160','ac161','ac162'],
            dt18: ['ac163','ac164','ac165','ac166','ac167','ac168'],
            dt19: ['ac169','ac170','ac171','ac172','ac173','ac174'],
            dt20: ['ac175','ac176','ac177','ac178','ac179','ac180'],
            dt21: ['ac181','ac182','ac183','ac184','ac185','ac186'],
            dt22: ['ac187','ac188','ac189','ac190','ac191','ac192'],
            dt23: ['ac193','ac194','ac195','ac196','ac197','ac198'],
            dt24: ['ac199','ac200','ac201','ac202','ac203','ac204'],
            dt25: ['ac205','ac206','ac207','ac208','ac209','ac210'],
            dt26: ['ac211','ac212','ac213','ac214','ac215','ac216'],
            dt27: ['ac217','ac218','ac219','ac220','ac221','ac222'],
            dt28: ['ac223','ac224','ac225','ac226','ac227','ac228'],
            dt29: ['ac229','ac230','ac231','ac232','ac233','ac234']
          };
          
          function getDistrictForAssembly(assemblyId) {
            for (const [districtId, assemblies] of Object.entries(DISTRICT_MAP)) {
              if (assemblies.includes(assemblyId.toLowerCase())) {
                return districtId;
              }
            }
            return 'dt7';
          }

          (async () => {
            const https = require('https');

            // --- 0. Fetch assembly info from dedicated API endpoint ---
            function fetchJson(url) {
              return new Promise((resolve, reject) => {
                https.get(url, { headers: { 'X-CF-Bypass': process.env.CF_BYPASS_SECRET } }, res => {
                  const chunks = [];
                  res.on('data', c => chunks.push(c));
                  res.on('end', () => {
                    try { resolve(JSON.parse(Buffer.concat(chunks).toString('utf8'))); }
                    catch(e) { reject(e); }
                  });
                }).on('error', reject);
              });
            }

            let assemblyName = ASSEMBLY_ID;
            let districtName = '';
            let districtId = getDistrictForAssembly(ASSEMBLY_ID);
            let assemblyPageUrl = SITE_URL + '/tamil-nadu/assembly/' + districtId + '/' + ASSEMBLY_ID;
            let lastElection = null;

            try {
              const apiUrl = SITE_URL + '/api/assembly-info/' + ASSEMBLY_ID;
              console.log('Fetching: ' + apiUrl);
              const info = await fetchJson(apiUrl);
              if (info && info.name) {
                assemblyName = info.name;
                districtName = info.districtName || '';
                districtId = info.districtId || districtId;
                assemblyPageUrl = SITE_URL + info.pageUrl;
                lastElection = info.lastElection || null;
                console.log('Got: ' + assemblyName + ' / ' + districtName + ' (' + districtId + ')');
                if (lastElection) {
                  console.log('Last election ' + lastElection.year + ': ' + lastElection.winner + ' (' + lastElection.party + ')');
                }
              }
            } catch (e) {
              console.warn('API fetch failed, using DISTRICT_MAP fallback:', e.message);
            }

            // Use x-card route to render specific template
            const pageUrl = SITE_URL + '/x-card/' + ASSEMBLY_ID + '?template=' + CARD_TEMPLATE;
            console.log('Opening: ' + pageUrl);
            console.log('Template: ' + CARD_TEMPLATE + ' (Index: ' + CURRENT_TEMPLATE_INDEX + ')');
            
            const browser = await puppeteer.launch({
              headless: true,
              args: ['--no-sandbox', '--disable-setuid-sandbox', '--disable-dev-shm-usage']
            });
            
            const page = await browser.newPage();
            // Set viewport to match card aspect ratio (1024:512) with 2x scaling for clarity
            await page.setViewport({ width: 1024, height: 512, deviceScaleFactor: 2 });
            // Bypass Cloudflare bot protection with secret header
            await page.setExtraHTTPHeaders({ 'X-CF-Bypass': process.env.CF_BYPASS_SECRET });
            
            try {
              await page.goto(pageUrl, { waitUntil: 'networkidle2', timeout: 60000 });
              
              // Wait for all fonts to be loaded (Geist Sans, Tamil fonts, etc.)
              await page.evaluate(() => document.fonts.ready);
              console.log('Fonts loaded');
              
              // Wait for card element to render
              await page.waitForSelector('[data-card]', { timeout: 10000 });
              console.log('Card element found');

              // Wait for fonts to load
              await page.evaluate(() => document.fonts.ready);
              await new Promise(r => setTimeout(r, 500));

              // Screenshot the card element
              const cardElement = await page.$('[data-card]');
              if (cardElement) {
                await cardElement.screenshot({ path: 'quick-view.png', type: 'png' });
                console.log('Card screenshot captured!');
              } else {
                await page.screenshot({ path: 'quick-view.png' });
                console.log('Full page screenshot captured');
              }
              
              fs.writeFileSync('assembly-info.json', JSON.stringify({
                assemblyId: ASSEMBLY_ID,
                assemblyName: assemblyName,
                districtName: districtName,
                districtId: districtId,
                pageUrl: assemblyPageUrl,
                lastElection: lastElection,
                template: CARD_TEMPLATE,
                templateIndex: CURRENT_TEMPLATE_INDEX
              }));

              console.log('Assembly: ' + assemblyName + ' | District: ' + districtName + ' | Template: ' + CARD_TEMPLATE);
              
            } catch (error) {
              console.error('Error:', error.message);
              await page.screenshot({ path: 'quick-view.png' });
            }
            
            await browser.close();
          })();
          ENDOFSCRIPT
        env:
          ASSEMBLY_ID: ${{ steps.get-assembly.outputs.assembly_id }}
          SITE_URL: ${{ env.SITE_URL }}

      - name: Disable Cloudflare security (allow bot)
        run: |
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/settings/security_level" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"value":"essentially_off"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print('CF security_level:', d['result']['value'] if d['success'] else d['errors'])"
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Capture Card screenshot with template
        run: node capture.cjs
        env:
          ASSEMBLY_ID: ${{ steps.get-assembly.outputs.assembly_id }}
          TEMPLATE_INDEX: ${{ steps.get-assembly.outputs.next_index }}
          FORCE_TIMELINE: ${{ steps.get-assembly.outputs.force_timeline }}
          SITE_URL: ${{ env.SITE_URL }}
          CF_BYPASS_SECRET: ${{ secrets.CF_BYPASS_SECRET }}

      - name: Restore Cloudflare security
        if: always()
        run: |
          curl -s -X PATCH "https://api.cloudflare.com/client/v4/zones/$CF_ZONE_ID/settings/security_level" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"value":"medium"}' | python3 -c "import json,sys; d=json.load(sys.stdin); print('CF security_level restored to:', d['result']['value'] if d['success'] else d['errors'])"
        env:
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}

      - name: Create post script
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: |
          cat > post.mjs << 'ENDOFSCRIPT'
          import https from 'https';
          import { readFileSync, writeFileSync } from 'fs';

          // Raw HTTPS helper — uses the built-in https module, no external deps
          // `body` can be a string, Buffer, or plain object (auto-JSON-serialized)
          function httpsRequest(hostname, path, method = 'GET', body = null, headers = {}) {
            return new Promise((resolve, reject) => {
              let requestBody = null;
              if (Buffer.isBuffer(body)) {
                requestBody = body;
              } else if (typeof body === 'string') {
                requestBody = body;
              } else if (body) {
                requestBody = JSON.stringify(body);
              }
              const req = https.request({
                hostname,
                path,
                method,
                headers: {
                  ...headers,
                  ...(requestBody ? { 'Content-Length': Buffer.byteLength(requestBody) } : {})
                }
              }, (res) => {
                const chunks = [];
                res.on('data', c => chunks.push(typeof c === 'string' ? Buffer.from(c) : c));
                res.on('end', () => {
                  const raw = Buffer.concat(chunks).toString('utf8');
                  let body = null;
                  try { body = JSON.parse(raw); } catch (_) {}
                  resolve({ status: res.statusCode, body, headers: res.headers, rawData: raw });
                });
              });
              req.on('error', reject);
              if (requestBody) req.write(requestBody);
              req.end();
            });
          }

          // Build binary multipart/form-data body.
          // `fields` is an array of { name, value, filename?, contentType? }
          // where value is a string or Buffer.
          function buildMultipart(boundary, fields) {
            const parts = [];
            for (const f of fields) {
              let header = `--${boundary}\r\nContent-Disposition: form-data; name="${f.name}"`;
              if (f.filename) header += `; filename="${f.filename}"`;
              header += '\r\n';
              if (f.contentType) header += `Content-Type: ${f.contentType}\r\n`;
              header += '\r\n';
              parts.push(Buffer.from(header, 'utf8'));
              parts.push(Buffer.isBuffer(f.value) ? f.value : Buffer.from(String(f.value), 'utf8'));
              parts.push(Buffer.from('\r\n', 'utf8'));
            }
            parts.push(Buffer.from(`--${boundary}--\r\n`, 'utf8'));
            return Buffer.concat(parts);
          }

          (async () => {
            let info = { assemblyId: process.env.ASSEMBLY_ID, assemblyName: 'Assembly', pageUrl: '', districtName: '' };
            try {
              info = JSON.parse(readFileSync('assembly-info.json', 'utf8'));
              console.log('Assembly:', info.assemblyName, '| URL:', info.pageUrl);
            } catch (e) { console.warn('assembly-info.json:', e.message); }

            const clientId     = process.env.TWITTER_CLIENT_ID;
            const clientSecret = process.env.TWITTER_CLIENT_SECRET;
            const refreshToken = process.env.REFRESH_TOKEN;

            // --- 1. Refresh OAuth 2.0 token ---
            console.log('Refreshing token...');
            const refreshBody = new URLSearchParams({
              grant_type: 'refresh_token',
              refresh_token: refreshToken,
              client_id: clientId,
            }).toString();
            const basicAuth = Buffer.from(`${clientId}:${clientSecret}`).toString('base64');
            const tokenRes = await httpsRequest('api.x.com', '/2/oauth2/token', 'POST', refreshBody, {
              'Authorization': `Basic ${basicAuth}`,
              'Content-Type': 'application/x-www-form-urlencoded',
            });
            console.log('Token refresh status:', tokenRes.status);
            if (tokenRes.status !== 200) {
              console.error('Token refresh failed (status ' + tokenRes.status + '):', JSON.stringify(tokenRes.body));
              console.error('Raw response:', tokenRes.rawData.slice(0, 500));
              process.exit(1);
            }
            const { access_token, refresh_token: newRefreshToken } = tokenRes.body;
            console.log('Access token obtained. Scope:', tokenRes.body.scope);

            // Save new refresh token if rotated
            if (newRefreshToken && newRefreshToken !== refreshToken) {
              writeFileSync('.new-refresh-token.txt', newRefreshToken, 'utf8');
              console.log('Refresh token rotated — will update GitHub Secret.');
            }

            // --- 2. Upload screenshot image via v2 media upload API ---
            let mediaIds = [];
            try {
              const imageBuffer = readFileSync('quick-view.png');
              console.log('Uploading image (' + imageBuffer.length + ' bytes)...');

              // X API v2 media upload — binary multipart/form-data
              const boundary = '----FormBoundary' + Date.now();
              const formBody = buildMultipart(boundary, [
                { name: 'media', value: imageBuffer, filename: 'quick-view.png', contentType: 'image/png' },
                { name: 'media_category', value: 'tweet_image' },
              ]);

              const mediaRes = await httpsRequest('api.x.com', '/2/media/upload', 'POST', formBody, {
                'Authorization': 'Bearer ' + access_token,
                'Content-Type': 'multipart/form-data; boundary=' + boundary,
                'User-Agent': 'IndiaStats-XBot/1.0',
              });

              console.log('Media upload HTTP status:', mediaRes.status);
              console.log('Media upload response:', JSON.stringify(mediaRes.body, null, 2));

              const mb = mediaRes.body || {};
              const mid = mb.media_id || mb.media_id_string || mb.id || (mb.data && (mb.data.media_id || mb.data.id));
              if (mediaRes.status >= 200 && mediaRes.status < 300 && mid) {
                mediaIds = [String(mid)];
                console.log('✅ Media uploaded successfully. Media ID:', mediaIds[0]);
              } else {
                console.warn('⚠️ Media upload did not return media_id (status ' + mediaRes.status + ') — will post text-only.');
                console.warn('Response body:', mediaRes.rawData.slice(0, 500));
              }
            } catch (e) {
              console.warn('⚠️ Image upload failed:', e.message, '— posting text-only.');
            }

            // --- 3. Build tweet text ---
            // X allows 280 chars; URLs always count as 23 chars (t.co)
            const name = info.assemblyName || info.assemblyId;
            const district = info.districtName || '';
            const le = info.lastElection; // { year, winner, party } | null

            // Clean tags: only ASCII alphanumeric
            const assemblyTag = name.replace(/[^a-zA-Z0-9]/g, '').slice(0, 25);
            const districtTag = district.replace(/[^a-zA-Z0-9]/g, '').slice(0, 20);

            // Varied opening lines to avoid repetitive content (cycles through templates)
            const OPENERS = [
              '🗳️ ' + name + ' Constituency, Tamil Nadu',
              '📍 Spotlight: ' + name + ', Tamil Nadu',
              '🏛️ Know Your Constituency: ' + name,
              '📊 Election Deep Dive — ' + name + ', TN',
              '🔍 ' + name + ' Assembly, Tamil Nadu',
              '📌 Constituency Profile: ' + name + ', TN',
            ];
            const opener = OPENERS[parseInt(info.templateIndex || '0') % OPENERS.length];

            // Body: include last election fact if available
            const electionFact = le
              ? 'Last won in ' + le.year + ' by ' + le.winner + ' (' + le.party + ').'
              : '';
            const baseBody = 'Explore election history, vote shares, winning margins & voter turnout since 1977.';
            const body = electionFact ? electionFact + '\n' + baseBody : baseBody;

            const tags = [
              assemblyTag ? '#' + assemblyTag : '',
              districtTag && districtTag !== assemblyTag ? '#' + districtTag : '',
              '#TamilNaduElections',
              '#IndiaStats',
              '#TamilNaduPolitics',
            ].filter(Boolean).join(' ');

            // URL counts as 23 chars; calculate actual budget
            const URL_COST = 23;
            const budget = 280 - (opener.length + 2 + URL_COST + 2 + tags.length + 6);
            const trimmedBody = body.length > budget ? body.slice(0, budget - 1) + '…' : body;
            const text = opener + '\n\n' + trimmedBody + '\n\n👉 ' + info.pageUrl + '\n\n' + tags;

            console.log('Tweet (' + text.length + ' chars, URL counts as ' + URL_COST + '):\n' + text + '\n---');

            // --- 4. Post tweet with media ---
            const tweetPayload = { text };
            if (mediaIds.length > 0) {
              tweetPayload.media = { media_ids: mediaIds };
              console.log('📎 Attaching media IDs:', mediaIds);
            }
            const tweetRes = await httpsRequest('api.x.com', '/2/tweets', 'POST', tweetPayload, {
              'Authorization': `Bearer ${access_token}`,
              'Content-Type': 'application/json',
            });
            console.log('Tweet response status:', tweetRes.status);
            console.log('Tweet response body:', JSON.stringify(tweetRes.body, null, 2));
            if (tweetRes.status !== 201) {
              console.error('❌ Tweet failed! Raw:', tweetRes.rawData.slice(0, 500));
              process.exit(1);
            }
            console.log('✅ Tweet posted! ID:', tweetRes.body.data?.id);
          })();
          ENDOFSCRIPT

      - name: Post to X
        if: ${{ github.event.inputs.dry_run != 'true' }}
        run: node post.mjs
        env:
          ASSEMBLY_ID: ${{ steps.get-assembly.outputs.assembly_id }}
          TWITTER_CLIENT_ID: ${{ secrets.TWITTER_CLIENT_ID }}
          TWITTER_CLIENT_SECRET: ${{ secrets.TWITTER_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ env.REFRESH_TOKEN }}

      - name: Persist rotated token
        # ALWAYS runs — even when posting fails — so the consumed refresh
        # token is never lost. Encrypts the new token and commits to repo.
        if: always()
        run: |
          if [ -f .new-refresh-token.txt ]; then
            NEW_TOKEN=$(cat .new-refresh-token.txt)
            echo "::add-mask::$NEW_TOKEN"
            echo "Persisting encrypted token to .github/x-token.enc ..."
            printf '%s' "$NEW_TOKEN" | openssl enc -aes-256-cbc -pbkdf2 -pass pass:"$PASS" -base64 > .github/x-token.enc
            git config --local user.email "github-actions[bot]@users.noreply.github.com"
            git config --local user.name "github-actions[bot]"
            git pull --rebase --autostash || true
            git add .github/x-token.enc
            git commit -m "chore: rotate oauth2 token [skip ci]" || echo "Nothing to commit"
            git push || echo "Push failed — will recover on next run"
          else
            echo "No token rotation needed."
          fi
        env:
          PASS: ${{ secrets.TWITTER_CLIENT_SECRET }}

      - name: Update state file
        if: ${{ steps.get-assembly.outputs.next_index != '-1' }}
        run: |
          STATE_FILE=".github/x-post-state.json"
          NEXT_INDEX="${{ steps.get-assembly.outputs.next_index }}"
          ASSEMBLY_ID="${{ steps.get-assembly.outputs.assembly_id }}"
          DATE=$(date -u +"%Y-%m-%d")

          jq --argjson idx "$NEXT_INDEX" \
             --arg date "$DATE" \
             --arg assembly "$ASSEMBLY_ID" \
             '.lastPostedIndex = $idx | .history += [{"date": $date, "assembly": $assembly}]' \
             $STATE_FILE > tmp.json && mv tmp.json $STATE_FILE

      - name: Update template state
        run: |
          TEMPLATE_INDEX=${{ steps.get-assembly.outputs.next_index }}
          TEMPLATE_NAMES='["Timeline", "Did You Know", "Fight Night", "Election Map", "Analytics", "Breaking News", "Newspaper", "Bold Classic"]'
          NEXT_TEMPLATE_INDEX=$(( (TEMPLATE_INDEX + 1) % 8 ))
          TEMPLATE_NAME=$(echo $TEMPLATE_NAMES | jq -r ".[$TEMPLATE_INDEX]")

          echo "Posted template: $TEMPLATE_NAME (index: $TEMPLATE_INDEX)"
          echo "Next template index: $NEXT_TEMPLATE_INDEX"

          jq --argjson idx "$NEXT_TEMPLATE_INDEX" '.lastTemplateIndex = $idx' .github/x-post-template-state.json > /tmp/state.json && mv /tmp/state.json .github/x-post-template-state.json

      - name: Commit updated state
        if: ${{ steps.get-assembly.outputs.next_index != '-1' }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .github/x-post-state.json .github/x-post-template-state.json
          git commit -m "chore: posted X card for ${{ steps.get-assembly.outputs.assembly_id }} with sequential templates [skip ci]" || echo "No changes"
          git push

