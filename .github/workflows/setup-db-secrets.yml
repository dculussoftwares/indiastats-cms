name: Setup DB Connection Secrets

# One-shot workflow that rebuilds DATABASE_URL (PgBouncer) and DATABASE_URL_DIRECT
# (direct PostgreSQL) from the credentials embedded in the existing DATABASE_URL_DIRECT.
#
# Why this is needed:
#   DATABASE_URL   → PgBouncer with sslmode=disable (Drizzle/Payload runtime)
#   DATABASE_URL_DIRECT → direct PostgreSQL with sslmode=require (schema push in CI,
#                         must bypass PgBouncer because Drizzle advisory locks are
#                         session-scoped and break under PgBouncer transaction mode)
#
# No new secrets required — password is extracted from the existing DATABASE_URL_DIRECT.
# Run once after any infra change (new PgBouncer, password rotation).

on:
  workflow_dispatch:

permissions:
  secrets: write
  contents: read

jobs:
  setup-db-secrets:
    name: Build & Set DATABASE_URL / DATABASE_URL_DIRECT
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PGBOUNCER_HOST: dculus-pgbouncer.ejfrc3bugjejc2d6.centralindia.azurecontainer.io
      DIRECT_HOST: dculus-shared-postgres.postgres.database.azure.com
      DB_NAME: indiastats_cms_db

    steps:
      - name: Extract credentials and set secrets
        env:
          EXISTING_DIRECT_URL: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          # Extract username and password from the existing direct URL.
          # urllib.parse.urlparse handles URL-encoded characters correctly.
          # The raw password value will be masked automatically by GitHub since
          # it came from a secret.
          PG_USER=$(python3 -c \
            "from urllib.parse import urlparse; u=urlparse('$EXISTING_DIRECT_URL'); print(u.username)")

          # Re-URL-encode the decoded password so special chars survive in a new URL
          ENCODED_PASS=$(python3 -c \
            "from urllib.parse import urlparse, quote; u=urlparse('$EXISTING_DIRECT_URL'); print(quote(u.password or '', safe=''))")

          # Mask the encoded password so it never appears in logs
          echo "::add-mask::$ENCODED_PASS"

          # ── Runtime URL (via PgBouncer) ──────────────────────────────────────
          # Payload/Drizzle does not use Prisma prepared statements, so no
          # ?pgbouncer=true flag needed. max: 2 pool cap is set in payload.config.ts.
          NEW_URL="postgresql://${PG_USER}:${ENCODED_PASS}@${PGBOUNCER_HOST}:5432/${DB_NAME}?sslmode=disable"

          gh secret set DATABASE_URL \
            --repo "$GITHUB_REPOSITORY" \
            --body "$NEW_URL"

          echo "✅ DATABASE_URL set → PgBouncer (db: ${DB_NAME})"

          # ── Direct URL (bypasses PgBouncer, used only for schema push in CI) ─
          NEW_DIRECT="postgresql://${PG_USER}:${ENCODED_PASS}@${DIRECT_HOST}:5432/${DB_NAME}?sslmode=require"

          gh secret set DATABASE_URL_DIRECT \
            --repo "$GITHUB_REPOSITORY" \
            --body "$NEW_DIRECT"

          echo "✅ DATABASE_URL_DIRECT set → direct PostgreSQL (db: ${DB_NAME})"
